### ロケール
d-i debian-installer/locale string ja_JP.UTF-8
d-i keyboard-configuration/xkb-keymap select jp

### ネットワーク（DHCP）
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string debian-server
d-i netcfg/get_domain string local

### アカウント
d-i passwd/root-login boolean false
d-i passwd/user-fullname string user1
d-i passwd/username string user1
d-i passwd/user-password-crypted password $6$2i60Q2JAkkDgQRq9$J19G/08kYxSi8hSMdeIysMUeNhN2W4OLuYd8pRV04MaGMc9eOWnleTNjZIVhOKQFrHJjCQg8wlDKs7g.FPoix/

### タイムゾーン
d-i clock-setup/utc boolean true
d-i time/zone string Asia/Tokyo
d-i clock-setup/ntp boolean true

### ディスク自動検出
# 128 GiB 以上、USB 接続以外のディスクを対象とする
# 候補が1台だけの場合に選択する

d-i partman/early_command string \
  DISK=""; COUNT=0; \
  for DEV in $(list-devices disk); do \
    NAME="${DEV##*/}"; \
    SYS="/sys/class/block/$NAME"; \
    [ -f "$SYS/size" ] || continue; \
    SIZE=$(cat "$SYS/size"); \
    [ "$SIZE" -ge 268435456 ] || continue; \
    PATHNAME=$(readlink -f "$SYS/device"); \
    case "$PATHNAME" in *usb*) continue ;; esac; \
    DISK="$DEV"; \
    COUNT=$((COUNT + 1)); \
  done; \
  if [ "$COUNT" -eq 1 ]; then \
    logger -t preseed "Selected disk: $DISK"; \
    debconf-set partman-auto/disk "$DISK"; \
    debconf-set grub-installer/bootdev "$DISK"; \
  else \
    logger -t preseed "Disk selection failed: $COUNT candidates"; \
    exit 1; \
  fi

### 自動パーティショニング
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic

### パーティション構成画面をスキップ
d-i partman/choose_partition select finish

### ディスクへの書き込み確認は手動で行う
# partman/confirm は事前承認しない
# partman/confirm_nooverwrite も事前承認しない

### パッケージ
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string sudo curl git
d-i pkgsel/upgrade select safe-upgrade

### ブートローダー
d-i grub-installer/only_debian boolean true

### インストール完了
d-i finish-install/reboot_in_progress note
